version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - USE_TESTNET=true
      - DRY_RUN=false
      - MARKET1=BTC
      - MARKET2=USDT
      - BUY_ORDER_AMOUNT=15
      - RESUME=true
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Persistir datos y logs en tu host para que no se pierdan si el contenedor muere
      - ./data:/app/data:z
      - ./logs:/app/logs:z

